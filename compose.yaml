name: cleanarchitecture

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cleanarchitecture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleanarchitecture"]
      interval: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CleanArchitecture.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=cleanarchitecture;Username=postgres;Password=postgres"
      Jwt__SigningKey: "compose-only-signing-key-not-for-any-real-environment"
      Seed__AdminEmail: "admin@example.com"
      Seed__AdminPassword: "Admin123!"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
